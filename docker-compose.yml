services:
  # 1. Edge Router / Reverse Proxy
  traefik:
    # UPDATED: v3.6+ is REQUIRED to fix "client version 1.24 is too old" on Docker 29+
    image: traefik:v3.6
    container_name: flc-gateway
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"                # The main entry point
      - "127.0.0.1:8080:8080"  # Traefik dashboard: unauthenticated, so this machine only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - flc-net

  # 2. Redis (Data & Discovery)
  redis:
    image: redis:7.4-bookworm
    container_name: flc-redis
    command: redis-server --appendonly yes --bind 0.0.0.0
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - flc-net

  # 3. Orchestrator (Control Plane). Same image as the nodes, different entry point;
  # building it here also produces the flc-node:latest image the orchestrator spawns.
  orchestrator:
    build: .
    image: flc-node:latest
    command: ["uvicorn", "src.orchestrator_api:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: flc-orchestrator
    # The Docker socket is root-owned. Access to it is root on the host anyway.
    user: root
    init: true
    healthcheck:
      disable: true # the image's probe targets the node API
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - orchestrator-data:/data # accounts (salted password hashes)
    environment:
      # Python SDK might still need this if it's old, but Traefik v3.6 handles itself
      - DOCKER_API_VERSION=1.44
      - MAX_USERS=${MAX_USERS:-10}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-localhost}
      - ACCOUNTS_DB=/data/accounts.db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`${PUBLIC_DOMAIN:-localhost}`)"
      - "traefik.http.routers.orchestrator.entrypoints=web"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8000"
    networks:
      - flc-net

volumes:
  redis-data:
  orchestrator-data:

networks:
  flc-net:
    name: flc-net
    driver: bridge
