# .github/workflows/ci.yml
name: FLC CI (Pull Request Check)

on:
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch: # Allows manual trigger
  workflow_call: # cd.yml runs the same gates before publishing

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static Analysis, Security, Unit & End-to-end Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Dependencies
        run: |
          poetry env use 3.12
          poetry install --no-interaction --no-root --with dev

      - name: Check Formatting (Black)
        run: poetry run black --check .

      - name: Check Import Sorting (Isort)
        run: poetry run isort --check-only --profile black .

      - name: Type Checking (MyPy)
        run: poetry run mypy src

      - name: Linting (Flake8)
        run: poetry run flake8 src tests

      - name: Security Scan (Bandit)
        run: poetry run bandit -r src -c pyproject.toml

      - name: Run Pytest with Coverage
        run: poetry run pytest -vv --cov=src --cov-report=term-missing --cov-fail-under=80

      # Real containers, Redis and network cuts: the guarantees unit tests can't prove.
      - name: End-to-end suite
        run: ./scripts/e2e.sh

      - name: Stack logs (on failure)
        if: failure()
        run: |
          docker ps -a
          docker compose logs --no-color
          for c in $(docker ps -aq --filter label=app=flc-node); do docker logs "$c"; done
